name: Compilar APK Shadow System

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar Gradle 8.7 (Requerido por Cordova)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Preparar Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Crear proyecto aislado y compilar APK
        run: |
          npm install -g cordova
          rm -rf /tmp/shadow_app
          cordova create /tmp/shadow_app com.gutylog.shadowsystem "ShadowRPG" --no-telemetry
          cp -r $GITHUB_WORKSPACE/www/* /tmp/shadow_app/www/
          cd /tmp/shadow_app
          cordova platform add android@13.0.0 --no-telemetry
          cordova build android --debug --no-telemetry

      - name: 7. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-RPG-APK
          path: /tmp/shadow_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
