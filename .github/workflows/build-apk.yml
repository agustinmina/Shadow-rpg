name: Compilar APK Shadow System

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17 (Requerido por Cordova Android 13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar licencias y Build Tools de Android 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Instalar Apache Cordova y generar plataforma Android
        run: |
          npm install -g cordova
          cordova platform add android@13.0.0 --no-telemetry

      - name: 7. Compilar APK
        run: |
          cordova build android --debug --no-telemetry

      - name: 8. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-RPG-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
