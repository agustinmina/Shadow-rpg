name: Compilar APK Shadow System

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar Build Tools en el SDK nativo de GitHub
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Crear proyecto Cordova limpio y compilar APK
        run: |
          npm install -g cordova
          cordova create app_temp com.gutylog.shadowsystem "Shadow System RPG" --no-telemetry
          cp -r www/* app_temp/www/
          cd app_temp
          cordova platform add android@13.0.0 --no-telemetry
          cordova build android --debug --no-telemetry

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-RPG-APK
          path: app_temp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
